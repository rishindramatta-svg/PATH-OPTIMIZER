apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: png9-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: png9-backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
