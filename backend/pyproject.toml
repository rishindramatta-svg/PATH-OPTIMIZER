[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "png9-learning-path"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2,<3", "pydantic>=2,<3", "python-jose[cryptography]>=3.3", "bcrypt>=4.1,<6", "python-multipart>=0.0.9", "alembic>=1.13", "psycopg[binary]>=3.2", "redis>=5"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2", "ruff>=0.16.9", "locust>=2.32"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
