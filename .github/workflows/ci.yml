name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './backend[dev]'
      - run: ruff check app tests locustfile.py loadtest alembic
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run lint && pnpm run typecheck && pnpm test && pnpm run build
        working-directory: frontend
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t png9-backend ./backend
      - run: docker build -t png9-frontend ./frontend
